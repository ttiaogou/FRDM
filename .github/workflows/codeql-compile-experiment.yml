name: CodeQL compile-only comparison (temporary)

on:
  push:
    branches: [P1]
    paths:
      - ".github/workflows/codeql-compile-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql-compile-only:
    name: CodeQL compile-only coverage experiment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9 and restore Gradle caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore PaddleOCR SDK and ONNX model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/freedom-ocr
          key: freedom-ocr-${{ runner.os }}-${{ hashFiles('ocr-plugin/build.gradle.kts', 'ocr-plugin/src/main/assets/ocr-model-catalog.json') }}
          restore-keys: |
            freedom-ocr-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Compile Java Kotlin sources without APK assembly
        run: |
          mkdir -p "$HOME/.cache/freedom-ocr"
          gradle --no-daemon --no-build-cache \
            -PfreedomOcrCacheDir="$HOME/.cache/freedom-ocr" \
            :core:testClasses \
            :business:testClasses \
            :gesture-core:testClasses \
            :gesture-runtime:testClasses \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugUnitTestJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            :ocr-plugin:compileDebugKotlin \
            :ocr-plugin:compileDebugJavaWithJavac

      - name: Analyze Kotlin and Java with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin-compile-only-experiment"
