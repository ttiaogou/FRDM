name: Freedom CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: freedom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify and build Freedom APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep both architecture verification layers. Any failure blocks the Gradle build.
      - name: Test architecture verifier
        run: python3 -m unittest discover -s tools/architecture -p 'test_*.py' -v

      - name: Enforce architecture boundaries
        run: python3 tools/architecture/verify_boundaries.py --root . --show-advisories

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # setup-gradle caches the pinned Gradle distribution and resolved dependencies.
      - name: Set up Gradle 8.9 and restore Gradle caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # GitHub-hosted ubuntu-latest runners are ephemeral, so Android SDK packages are
      # installed per run instead of storing a large SDK cache. OCR resources are cached separately.
      - name: Restore PaddleOCR SDK and ONNX model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/freedom-ocr
          key: freedom-ocr-${{ runner.os }}-${{ hashFiles('ocr-plugin/build.gradle.kts', 'ocr-plugin/src/main/assets/ocr-model-catalog.json') }}
          restore-keys: |
            freedom-ocr-${{ runner.os }}-

      - name: Validate Android resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for source_root in (Path("app/src/main"), Path("ocr-plugin/src/main")):
              for path in source_root.rglob("*.xml"):
                  ET.parse(path)
                  print(f"XML OK: {path}")
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality

      # One Gradle invocation performs all module tests and both APK builds; CodeQL observes
      # this same compilation instead of running a second, duplicate Android build.
      - name: Test modules and build Freedom and OCR plugin debug APKs
        run: |
          mkdir -p "$HOME/.cache/freedom-ocr"
          gradle --no-daemon clean \
            -PfreedomOcrCacheDir="$HOME/.cache/freedom-ocr" \
            :core:test \
            :business:test \
            :gesture-core:test \
            :gesture-runtime:test \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :ocr-plugin:assembleDebug

      # Preserve test reports even if a test or build task fails.
      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Freedom debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Freedom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload OCR plugin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Freedom-OCR-plugin-debug-apk
          path: ocr-plugin/build/outputs/apk/debug/ocr-plugin-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Analyze Kotlin and Java with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
