name: P2 preinstalled platform-tools diagnostics (temporary)

on:
  push:
    branches: [P1]
    paths:
      - ".github/workflows/p2-platform-tools-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-platform-tools:
    name: Inspect preinstalled SDK (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [test, build-freedom-apk, build-ocr-plugin-apk, codeql]
    steps:
      - name: Inspect preinstalled platform-tools without changing SDK
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          dir="$root/platform-tools"
          echo "SDK_ROOT=$root"
          echo "PATH_ADB=$(command -v adb || true)"
          if [ ! -d "$dir" ]; then
            echo "PREINSTALLED_PLATFORM_TOOLS=ABSENT"
            exit 0
          fi
          echo "PREINSTALLED_PLATFORM_TOOLS=PRESENT"
          if [ -f "$dir/source.properties" ]; then
            cat "$dir/source.properties"
            echo "PREINSTALLED_VERSION=$(sed -n 's/^Pkg.Revision=//p' "$dir/source.properties" | head -1)"
          else
            echo "PREINSTALLED_SOURCE_PROPERTIES=MISSING"
          fi
          for bin in adb fastboot sqlite3; do
            if [ -f "$dir/$bin" ]; then
              echo "BINARY_${bin}_PRESENT=true"
              if [ -x "$dir/$bin" ]; then
                echo "BINARY_${bin}_EXECUTABLE=true"
              else
                echo "BINARY_${bin}_EXECUTABLE=false"
              fi
            else
              echo "BINARY_${bin}_PRESENT=false"
            fi
          done
          if [ -x "$dir/adb" ]; then
            "$dir/adb" version
          fi
          if [ -x "$dir/fastboot" ]; then
            "$dir/fastboot" --version
          fi
          echo "FILE_COUNT=$(find "$dir" -type f | wc -l)"
          echo "TOTAL_BYTES=$(du -sb "$dir" | cut -f1)"
          echo "PREINSTALLED_INSPECTION_COMPLETE=true"
      - name: Set up Android SDK with unchanged production defaults
        uses: android-actions/setup-android@v4
      - name: Inspect platform-tools after action setup
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          dir="$root/platform-tools"
          test -f "$dir/source.properties"
          test -x "$dir/adb"
          test -x "$dir/fastboot"
          echo "POST_SETUP_VERSION=$(sed -n 's/^Pkg.Revision=//p' "$dir/source.properties" | head -1)"
          "$dir/adb" version
          "$dir/fastboot" --version
          echo "POST_SETUP_FILE_COUNT=$(find "$dir" -type f | wc -l)"
          echo "POST_SETUP_TOTAL_BYTES=$(du -sb "$dir" | cut -f1)"
